<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="container">
        <div class="Todo-Header">
            <h1>My Todo List</h1>
        </div>

        <div class="Add-Todo">
            <h3>Tasks</h3>
            <button id="Create-Todo">Add Todo</button>
        </div>

        <div class="Todo-list">
            <ul>
                <li>
                    Hai 
                    <button>
                        <i data-feather="edit-3"></i>
                    </button>
                </li>

                <li>
                    Hai 
                    <button>
                        <i data-feather="edit-3"></i>
                    </button>
                </li>
                <li>
                    Hai 
                    <button>
                        <i data-feather="edit-3"></i>
                    </button>
                </li>
            </ul>
        </div>

        <div class="menu-Todo">
            <form action="Todo.html">
                <input type="text" placeholder="Edit Todo" required>
                <button type="submit"><i data-feather="check"></i></button>
                <button><i data-feather="x"></i></button>
            </form>
        </div>

    </div>

    <!-- Struktur Modal -->
    <div id="todoModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Todo</h3>
                <button type="button" id="closeXBtn" class="modal-close-icon"><i data-feather="x"></i></button>
            </div>
            <form action="Todo.html" class="modal-form">
                <input type="text" placeholder="Tulis todo baru..." required autofocus>
                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="btn-cancel">Batal</button>
                    <button type="submit" class="btn-submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
